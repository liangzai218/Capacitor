name: Build Capacitor APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Web Directory
        run: |
          mkdir -p www
          cp *.html *.js *.json *.png www/ 2>/dev/null || true
          rm -f www/package.json www/capacitor.config.json www/manifest.json

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Add Android Platform
        run: npx cap add android

      # 🌟 终极修复：直接重写 Android 原生入口，强制全屏并设置深色图标
      - name: Enforce True Immersive Mode
        run: |
          cat > android/app/src/main/java/com/liangzai/lifemanager/MainActivity.java << 'EOF'
          package com.liangzai.lifemanager;

          import android.os.Bundle;
          import android.graphics.Color;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  
                  // 1. 让 WebView 延伸到状态栏和导航栏下方（全屏）
                  WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
                  
                  // 2. 状态栏和导航栏设为透明
                  getWindow().setStatusBarColor(Color.TRANSPARENT);
                  getWindow().setNavigationBarColor(Color.TRANSPARENT);
                  
                  // 3. 强制状态栏和导航栏图标为深色（因为你的背景是浅色）
                  WindowInsetsControllerCompat windowInsetsController = 
                      WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
                  if (windowInsetsController != null) {
                      windowInsetsController.setAppearanceLightStatusBars(true);
                      windowInsetsController.setAppearanceLightNavigationBars(true);
                  }
              }
          }
          EOF

      - name: Generate App Icons
        run: npx @capacitor/assets generate --android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Life-Manager-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
