name: Build Capacitor APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure npm mirrors
        run: |
          npm config set registry https://registry.npmmirror.com
          echo "SHARP_DIST_BASE_URL=https://npmmirror.com/mirrors/sharp-libvips" >> $GITHUB_ENV
          echo "SHARP_BINARY_HOST=https://npmmirror.com/mirrors/sharp" >> $GITHUB_ENV
          echo "SHARP_LIBVIPS_BINARY_HOST=https://npmmirror.com/mirrors/sharp-libvips" >> $GITHUB_ENV

      - name: Prepare Web Directory
        run: |
          mkdir -p www
          cp *.html *.js *.json *.png www/ 2>/dev/null || true
          cp -r assets www/ 2>/dev/null || true
          rm -f www/package.json www/capacitor.config.json www/manifest.json

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps --fetch-timeout=60000 || \
          npm install --legacy-peer-deps --fetch-timeout=60000 || \
          npm install --legacy-peer-deps --fetch-timeout=60000

      - name: Add Android Platform
        run: npx cap add android

      - name: Enforce True Immersive Mode & Back Button
        run: |
          cat > android/app/src/main/java/com/liangzai/lifemanager/MainActivity.java << 'EOF'
          package com.liangzai.lifemanager;

          import android.os.Bundle;
          import android.graphics.Color;
          import android.webkit.WebView;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
                  getWindow().setStatusBarColor(Color.TRANSPARENT);
                  getWindow().setNavigationBarColor(Color.TRANSPARENT);
                  WindowInsetsControllerCompat windowInsetsController = 
                      WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
                  if (windowInsetsController != null) {
                      windowInsetsController.setAppearanceLightStatusBars(true);
                      windowInsetsController.setAppearanceLightNavigationBars(true);
                  }
              }

              @Override
              public void onBackPressed() {
                  WebView webView = getBridge().getWebView();
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Generate App Icons
        run: npx @capacitor/assets generate --android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Life-Manager-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
