name: Build Capacitor APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Web Directory
        run: |
          mkdir -p www
          cp *.html *.js *.json *.png www/ 2>/dev/null || true
          rm -f www/package.json www/capacitor.config.json www/manifest.json

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Add Android Platform
        run: npx cap add android

      # 🌟 核心修复：强制修改安卓原生样式，实现状态栏透明（沉浸式）
      - name: Make Status Bar Transparent
        run: |
          sed -i 's|<item name="android:background">@null</item>|<item name="android:background">@null</item>\n        <item name="android:statusBarColor">@android:color/transparent</item>\n        <item name="android:windowLightStatusBar">true</item>\n        <item name="android:navigationBarColor">@android:color/transparent</item>|' android/app/src/main/res/values/styles.xml

      - name: Generate App Icons
        run: npx @capacitor/assets generate --android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Life-Manager-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
